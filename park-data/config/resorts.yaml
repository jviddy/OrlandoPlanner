    name: SeaWorld Parks and Resorts Orlando
    slug: seaworldorlandoresort
    parks:
      - { key: SW, id: 27d64dee-d85e-48dc-ad6d-8077445cd946, name: SeaWorld Orlando }
      - { key: AQ, id: 9e2867f8-68eb-454f-b367-0ed0fd72d72a, name: Aquatica Orlando, water_park: true }
