[project]
name = "parkdata"
version = "0.1.0"
description = "Ingest, normalise and project Orlando theme-park data from the ThemeParks.wiki API"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "holidays>=0.57",
]

[project.scripts]
parkdata = "parkdata.cli:main"

[tool.setuptools]
packages = ["parkdata"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
