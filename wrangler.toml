# Cloudflare Pages config. Dashboard-generated settings are merged with the
# explicit bindings below. Build output for the Nitro `cloudflare-pages`
# preset is ./dist.
name = "orlando-planner-git"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables mirrored from the Pages dashboard.
[vars]
NUXT_AUTH_ENABLED = "true"
NUXT_PUBLIC_GOOGLE_ENABLED = "true"

# Preview environment uses the preview D1 database.
[[d1_databases]]
binding = "ORLANDO_DB"
database_name = "orlando-planner-preview"
database_id = "7e917655-43fe-48b7-a28e-3f76ca26ca68"

# Production environment uses the production D1 database.
[[env.production.d1_databases]]
binding = "ORLANDO_DB"
database_name = "orlando-planner-production"
database_id = "8235120f-1820-455a-8b9b-92ca36f16817"
