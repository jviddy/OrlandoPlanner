# Cloudflare Pages config for local preview + `wrangler pages deploy`.
# Build output for the Nitro `cloudflare-pages` preset is ./dist
name = "orlando-planner"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Local development and preview deployments use isolated preview data.
[[d1_databases]]
binding = "ORLANDO_DB"
database_name = "orlando-planner-preview"
database_id = "7e917655-43fe-48b7-a28e-3f76ca26ca68"
migrations_dir = "migrations"

# Production is separately provisioned. Anonymous sync remains disabled in
# Nuxt runtime config until its explicit upload/recovery UI is released.
[[env.production.d1_databases]]
binding = "ORLANDO_DB"
database_name = "orlando-planner-production"
database_id = "8235120f-1820-455a-8b9b-92ca36f16817"
migrations_dir = "migrations"
